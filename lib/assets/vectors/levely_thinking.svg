<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Kepala Utama (Deep Purple) -->
  <rect x="20" y="40" width="160" height="140" rx="50" fill="#441F7F" />
  
  <!-- Layar Wajah (Darker Purple) -->
  <rect x="40" y="65" width="120" height="90" rx="30" fill="#2E1555" />
  
  <!-- Antena "Level-Up" (Deep Purple + Yellow Tip) -->
  <rect x="92" y="15" width="16" height="30" rx="8" fill="#441F7F" />
  <circle cx="100" cy="15" r="10" fill="#FFFF00" stroke="#441F7F" stroke-width="3" />
  
  <!-- Mata Digital - Ekspresi Berpikir (Dots/Mikir) -->
  <circle cx="75" cy="110" r="6" fill="#DDC8FF" />
  <circle cx="125" cy="110" r="6" fill="#DDC8FF" />
  
  <!-- Mulut - Garis Lurus (Serius/Mikir) -->
  <line x1="90" y1="135" x2="110" y2="135" stroke="#DDC8FF" stroke-width="4" stroke-linecap="round" />
</svg>
