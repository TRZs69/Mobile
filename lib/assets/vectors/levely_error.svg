<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Kepala Utama (Deep Purple) -->
  <rect x="20" y="40" width="160" height="140" rx="50" fill="#441F7F" />
  
  <!-- Layar Wajah (Darker Purple) -->
  <rect x="40" y="65" width="120" height="90" rx="30" fill="#2E1555" />
  
  <!-- Antena "Level-Up" (Deep Purple + Red Tip) -->
  <rect x="92" y="15" width="16" height="30" rx="8" fill="#441F7F" />
  <circle cx="100" cy="15" r="10" fill="#FF5252" stroke="#441F7F" stroke-width="3" />
  
  <!-- Mata Digital - Ekspresi Error (X X) -->
  <!-- Mata Kiri -->
  <line x1="65" y1="95" x2="85" y2="115" stroke="#DDC8FF" stroke-width="8" stroke-linecap="round" />
  <line x1="85" y1="95" x2="65" y2="115" stroke="#DDC8FF" stroke-width="8" stroke-linecap="round" />
  
  <!-- Mata Kanan -->
  <line x1="115" y1="95" x2="135" y2="115" stroke="#DDC8FF" stroke-width="8" stroke-linecap="round" />
  <line x1="135" y1="95" x2="115" y2="115" stroke="#DDC8FF" stroke-width="8" stroke-linecap="round" />
  
  <!-- Mulut - Garis Sedikit Melengkung ke Bawah (Sad) -->
  <path d="M85 145 Q100 135 115 145" stroke="#DDC8FF" stroke-width="4" fill="none" stroke-linecap="round" />
</svg>
